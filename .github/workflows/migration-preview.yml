name: Validate Payload database migrations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migration-preview.yml"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - ".github/workflows/migration-preview.yml"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: ci_only_ephemeral_password
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms_test -d cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://cms_test:ci_only_ephemeral_password@127.0.0.1:5432/cms_test
      PAYLOAD_SECRET: ci-only-migration-secret-never-used-in-production
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Create private schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA qjai_content;"
      - name: Apply checked-in Payload migrations
        run: pnpm payload migrate
      - name: Verify migrations are idempotent
        run: pnpm payload migrate
      - name: Verify schema isolation
        run: |
          count=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'qjai_content'")
          echo "Payload tables in private schema: $count"
          test "$count" -ge 4
          exposed=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")
          echo "Application tables in public schema: $exposed"
          test "$exposed" -eq 0

      - name: Verify publication records protect article deletion
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $qjai$
          DECLARE
            article_id integer;
            record_id integer;
            delete_blocked boolean := false;
          BEGIN
            SELECT CASE confdeltype WHEN 'r' THEN true ELSE false END
              INTO delete_blocked
              FROM pg_constraint
              WHERE conname = 'publishing_records_article_id_articles_id_fk';
            IF delete_blocked IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'publishing_records FK must use ON DELETE RESTRICT';
            END IF;
            IF (SELECT is_nullable FROM information_schema.columns
                WHERE table_schema = 'qjai_content' AND table_name = 'publishing_records'
                  AND column_name = 'article_id') <> 'NO' THEN
              RAISE EXCEPTION 'publishing_records.article_id must remain NOT NULL';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'qjai_content' AND table_name = 'users'
                AND column_name = 'is_admin' AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION 'users.is_admin must exist and be NOT NULL';
            END IF;

            INSERT INTO qjai_content.articles
              (title, slug, summary, body_markdown, status, source)
              VALUES ('FK test', 'fk-test-' || txid_current(), 'summary', 'body', 'draft', 'test')
              RETURNING id INTO article_id;

            INSERT INTO qjai_content.publishing_records
              (article_id, channel, state)
              VALUES (article_id, 'website', 'pending')
              RETURNING id INTO record_id;

            BEGIN
              DELETE FROM qjai_content.articles WHERE id = article_id;
              RAISE EXCEPTION 'article delete unexpectedly succeeded with a publication record';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;

            DELETE FROM qjai_content.publishing_records WHERE id = record_id;
            DELETE FROM qjai_content.articles WHERE id = article_id;
          END $qjai$;
          SQL

      - name: Verify authentication, editorial permissions and ingestion API
        env:
          CONTENT_INGEST_TOKEN: ci-ingest-token-for-integration-tests-1234567890
          BASE_URL: http://127.0.0.1:3000
        run: |
          set -Eeuo pipefail
          pnpm dev --hostname 127.0.0.1 --port 3000 >/tmp/qjai-cms-dev.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail "$BASE_URL/api/health" >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/qjai-cms-dev.log
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/qjai-cms-dev.log
            echo "CMS did not become ready within 180 seconds" >&2
            exit 1
          fi
          node scripts/auth-integration-test.mjs

      - name: Verify production Docker and Compose runtime
        env:
          DATABASE_URL: postgresql://cms_test:ci_only_ephemeral_password@host.docker.internal:5432/cms_test
          CONTENT_INGEST_TOKEN: ci-ingest-token-for-integration-tests-1234567890
          SITE_URL: http://127.0.0.1:3100
        run: bash scripts/docker-runtime-acceptance.sh

      - name: Verify backup and restore round-trip
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          pg_dump --version
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO qjai_content.users (email) VALUES ('backup-restore-test@example.invalid')"
          export BACKUP_DIR=/tmp/qjai-cms-backups
          bash scripts/db-backup.sh
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE qjai_restore_test"
          cleanup() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS qjai_restore_test WITH (FORCE)" >/dev/null || true
          }
          trap cleanup EXIT
          export RESTORE_DATABASE_URL="$(node -e 'const u = new URL(process.env.DATABASE_URL); u.pathname = "/qjai_restore_test"; process.stdout.write(u.toString())')"
          export BACKUP_FILE="$(find "$BACKUP_DIR" -type f -name '*.dump' -print -quit)"
          test -n "$BACKUP_FILE"
          DATABASE_URL="$RESTORE_DATABASE_URL" CONFIRM_RESTORE=RESTORE_QJAI_CONTENT_TO_EMPTY_DATABASE bash scripts/db-restore.sh
          restored_tables="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'qjai_content' AND table_type = 'BASE TABLE'")"
          echo "Restored table count: $restored_tables"
          test "$restored_tables" -ge 4
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM qjai_content.payload_migrations"
          restored_users="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM qjai_content.users WHERE email = 'backup-restore-test@example.invalid'")"
          test "$restored_users" -eq 1

      - name: Verify empty-schema baseline backup and restore
        run: |
          set -Eeuo pipefail
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          pg_dump --version
          pg_restore --version
          EMPTY_SOURCE_DB=qjai_empty_backup_source
          EMPTY_TARGET_DB=qjai_empty_restore_target

          cleanup() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $EMPTY_TARGET_DB WITH (FORCE)" >/dev/null 2>&1 || true
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $EMPTY_SOURCE_DB WITH (FORCE)" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $EMPTY_SOURCE_DB"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $EMPTY_TARGET_DB"

          make_database_url() {
            DB_NAME="$1" node -e 'const u = new URL(process.env.DATABASE_URL); u.pathname = "/" + process.env.DB_NAME; process.stdout.write(u.toString())'
          }
          EMPTY_SOURCE_URL="$(make_database_url "$EMPTY_SOURCE_DB")"
          EMPTY_TARGET_URL="$(make_database_url "$EMPTY_TARGET_DB")"

          psql "$EMPTY_SOURCE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA qjai_content"

          if DATABASE_URL="$EMPTY_SOURCE_URL" BACKUP_DIR=/tmp/qjai-cms-empty-default bash scripts/db-backup.sh >/tmp/qjai-cms-empty-default.log 2>&1; then
            cat /tmp/qjai-cms-empty-default.log
            echo "ERROR: default backup unexpectedly accepted an empty schema." >&2
            exit 1
          fi
          if find /tmp/qjai-cms-empty-default -type f -name '*.dump' -print -quit | grep -q .; then
            echo "ERROR: default empty-schema guard left a dump file behind." >&2
            exit 1
          fi

          EMPTY_BACKUP_DIR=/tmp/qjai-cms-empty-baseline
          ALLOW_EMPTY_SCHEMA=1 DATABASE_URL="$EMPTY_SOURCE_URL" BACKUP_DIR="$EMPTY_BACKUP_DIR" bash scripts/db-backup.sh
          EMPTY_BACKUP_FILE="$(find "$EMPTY_BACKUP_DIR" -type f -name '*.dump' -print -quit)"
          test -n "$EMPTY_BACKUP_FILE"
          pg_restore --list "$EMPTY_BACKUP_FILE" | grep -F "SCHEMA - qjai_content"

          if DATABASE_URL="$EMPTY_TARGET_URL" BACKUP_FILE="$EMPTY_BACKUP_FILE" CONFIRM_RESTORE=RESTORE_QJAI_CONTENT_TO_EMPTY_DATABASE bash scripts/db-restore.sh >/tmp/qjai-cms-empty-restore-default.log 2>&1; then
            cat /tmp/qjai-cms-empty-restore-default.log
            echo "ERROR: default restore unexpectedly accepted an empty-schema archive." >&2
            exit 1
          fi
          target_schema_before="$(psql "$EMPTY_TARGET_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name = 'qjai_content')")"
          test "$target_schema_before" = "f"

          ALLOW_EMPTY_SCHEMA=1 DATABASE_URL="$EMPTY_TARGET_URL" BACKUP_FILE="$EMPTY_BACKUP_FILE" CONFIRM_RESTORE=RESTORE_QJAI_CONTENT_TO_EMPTY_DATABASE bash scripts/db-restore.sh
          target_schema_after="$(psql "$EMPTY_TARGET_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name = 'qjai_content')")"
          target_table_count="$(psql "$EMPTY_TARGET_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'qjai_content' AND table_type = 'BASE TABLE'")"
          test "$target_schema_after" = "t"
          test "$target_table_count" -eq 0

      - name: Show migration status
        run: pnpm payload migrate:status
