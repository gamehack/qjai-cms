name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate operational shell scripts
        run: bash -n scripts/db-backup.sh scripts/db-restore.sh scripts/smoke-test.sh scripts/docker-runtime-acceptance.sh
      - name: Validate Docker Compose configuration
        run: |
          touch .env .migration.env
          IMAGE_TAG=sha-ci IMAGE_SHA=ci docker compose config --quiet
      - name: Run unit and policy tests
        run: pnpm test
      - name: Check integration test syntax
        run: node --check scripts/auth-integration-test.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Inventory production dependency licenses
        run: pnpm licenses list --prod
      - name: Generate Payload import map
        run: pnpm run generate:importmap
        env:
          PAYLOAD_SECRET: ci-only-secret-not-for-production-1234567890
          DATABASE_URL: placeholder-for-ci-only
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build without database connection
        run: pnpm exec next build --experimental-build-mode compile
        env:
          PAYLOAD_SECRET: ci-only-secret-not-for-production-1234567890
          DATABASE_URL: placeholder-for-ci-only
          SITE_URL: http://localhost:3000
