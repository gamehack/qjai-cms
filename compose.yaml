services:
  qjai-cms:
    image: ghcr.io/gamehack/qjai-cms:${IMAGE_TAG:?Set IMAGE_TAG to a tested build tag}
    container_name: qjai-cms
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - type: bind
        source: /etc/qjai-cms/supabase-ca.crt
        target: /run/secrets/supabase-ca.crt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - default
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.qjai-cms.rule=Host(`qjai.org`)"
      - "traefik.http.routers.qjai-cms.entrypoints=websecure"
      - "traefik.http.routers.qjai-cms.tls=true"
      - "traefik.http.routers.qjai-cms.tls.certresolver=letsencrypt"
      - "traefik.http.services.qjai-cms.loadbalancer.server.port=3000"
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r => { const d = await r.json(); process.exit(r.ok && d.checks?.database === 'ok' ? 0 : 1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  qjai-cms-migrate:
    image: ghcr.io/gamehack/qjai-cms:migrate-${IMAGE_SHA:-dev}
    container_name: qjai-cms-migrate
    profiles: ["migrate"]
    env_file:
      - .migration.env
    volumes:
      - type: bind
        source: /etc/qjai-cms/supabase-ca.crt
        target: /run/secrets/supabase-ca.crt
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true

networks:
  traefik_default:
    external: true
