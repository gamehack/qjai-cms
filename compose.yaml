services:
  qjai-cms:
    image: ghcr.io/gamehack/qjai-cms:${IMAGE_TAG:?Set IMAGE_TAG to a tested build tag}
    container_name: qjai-cms
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
